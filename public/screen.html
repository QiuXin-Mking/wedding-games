<!doctype html><html lang=zh-CN><meta charset=utf-8><title>婚礼答题 · 大屏</title>
<meta name=viewport content="width=1920">
<style>
/* 大屏与手机端共用一套色板，但尺度完全不同：
   这块屏要在宴会厅最后一排（12~15 米）读得清，所有字号按 1920 宽度用 vw 定，
   投到任何尺寸的幕布上比例都不变。 */
:root{
  --paper:#F7F1E8;--ink:#3D2B23;--ink2:#6B5344;--ink3:#A99683;
  --seal:#C8362F;--gold:#C9A227;--line:rgba(61,43,35,.12);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font:1.1vw/1.5 system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:"Songti SC","Noto Serif CJK SC",serif}
.num{font-variant-numeric:tabular-nums}
#stage{height:100%;display:grid;place-content:center;justify-items:center;gap:2.2vh;padding:4vh 5vw;text-align:center}

/* 角标：题库 + 全屏按钮。做小做淡 —— 它们是给工作人员看的，不是给全场看的 */
#chip{position:fixed;left:1.4vw;top:1.4vw;display:flex;gap:.7vw;align-items:center;font-size:.85vw;color:var(--ink3);z-index:5}
#chip b{padding:.28vw .7vw;border:1px solid var(--line);border-radius:.4vw;font-weight:500}
#chip b.live{border-color:var(--seal);color:var(--seal)}
#chip button{padding:.28vw .7vw;border:1px solid var(--line);border-radius:.4vw;background:none;color:inherit;font:inherit;cursor:pointer}
#conn{position:fixed;right:1.4vw;top:1.4vw;font-size:.85vw;color:var(--ink3);z-index:5}
#conn.bad{color:var(--seal)}

/* ── 待机 ───────────────────────────── */
.title{font:600 4.6vw/1.2 "Songti SC","Noto Serif CJK SC",serif}
.rule{width:14vw;height:2px;background:var(--gold)}
.lead{font-size:1.5vw;color:var(--ink2)}
  padding:1.4vh 1vw;border:1px solid var(--line2);border-radius:.7vw;background:#fff;color:var(--ink)}
  background:var(--seal);color:#fff;cursor:pointer;letter-spacing:.1em}
#qr{width:26vh;height:26vh;border:.5vh solid #fff;box-shadow:0 0 0 1px var(--line);background:#fff}
.url{font:600 1.5vw/1 system-ui;letter-spacing:.02em;color:var(--ink2)}
/* 待机页的奖项栏。宾客扫码前就该知道有奖可拿 —— 不然只是「陪着点几下」，
   没人会认真抢答，场子也热不起来。 */
.prizes{display:flex;gap:1.6vw;justify-content:center;margin-top:.4vh}
.prize{display:grid;justify-items:center;gap:.5vh;padding:1.3vh 2vw;
  border:1px solid var(--line);border-radius:.7vw;background:rgba(201,162,39,.07)}
.prize b{font:600 2.1vw/1 "Songti SC","Noto Serif CJK SC",serif;color:var(--ink)}
.prize span{font-size:1.05vw;color:var(--ink2);font-variant-numeric:tabular-nums}
.prize:first-child{border-color:rgba(200,54,47,.45);background:rgba(200,54,47,.07)}
.prize:first-child b{color:var(--seal)}
.count{font:600 3.4vw/1 system-ui;font-variant-numeric:tabular-nums}

/* ── 答题：倒计时是全场的节奏，这里它必须最大 ── */
.qno{font-size:1.4vw;color:var(--ink3);letter-spacing:.1em}
.qtext{font:600 3.6vw/1.35 "Songti SC","Noto Serif CJK SC",serif;max-width:78vw;text-wrap:balance}
#big{font:600 17vh/1 system-ui;font-variant-numeric:tabular-nums;color:var(--seal);letter-spacing:-.02em}
#big.warn{animation:beat .9s cubic-bezier(.23,1,.32,1) infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.4vh 2.4vw;max-width:76vw;width:100%}
.opt{display:flex;align-items:center;gap:1.2vw;padding:1.5vh 1.8vw;border:2px solid var(--line);border-radius:.7vw;font-size:2.1vw;text-align:left;transition:border-color .2s,background-color .2s}
.opt .k{flex:none;width:2.6vw;height:2.6vw;border:2px solid var(--line);border-radius:50%;display:grid;place-content:center;font:600 1.4vw/1 system-ui;color:var(--ink2)}
.opt.right{border-color:var(--gold);background:rgba(201,162,39,.12)}
.opt.right .k{border-color:var(--gold);color:var(--gold)}
.bars{display:flex;gap:.6vw;align-items:flex-end;height:1.1vh;margin-left:auto}
.opt .cnt{margin-left:auto;font:600 1.7vw/1 system-ui;font-variant-numeric:tabular-nums;color:var(--ink3)}
.opt.right .cnt{color:var(--gold)}
.answered{font-size:1.6vw;color:var(--ink2)}
.answered b{font-weight:600;font-variant-numeric:tabular-nums}

/* ── 排行 ───────────────────────────── */
/* 终局要放 9 行 + 标题，1080 高度下按结算态的尺度会溢出（标题会被顶掉）。
   给终局单独收紧行高与字号；结算态只有前五名，维持原样。 */
.final .board{gap:.55vh;width:58vw}
.final .row{padding:.75vh 1.4vw;font-size:1.85vw}
.final .title{font-size:3.6vw}
.final .rule{margin-bottom:.4vh}
.board{display:grid;gap:.9vh;width:62vw}
.row{display:flex;align-items:center;gap:1.6vw;padding:1.1vh 1.6vw;border-radius:.6vw;font-size:2.2vw}
.row.t1{background:rgba(200,54,47,.09)}
.row.t2,.row.t3{background:rgba(61,43,35,.045)}
.row s{flex:none;width:2.4vw;text-decoration:none;color:var(--ink3);font-variant-numeric:tabular-nums;font-weight:600}
.row.t1 s{color:var(--seal)}
.row u{flex:1;text-decoration:none;font-family:"Songti SC","Noto Serif CJK SC",serif;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row em{font-style:normal;font-variant-numeric:tabular-nums;font-weight:600}
/* 奖项标签。颁奖时全场要一眼看出哪几位有奖，所以给有奖的行一个实心标签，
   并在最后一个奖项和第一个无奖名次之间画一道分界线。 */
.row .aw{flex:none;font:600 1.15vw/1 system-ui;letter-spacing:.06em;padding:.5vh .8vw;
  border-radius:.4vw;background:var(--gold);color:#fff;margin-left:.8vw}
.row.t1 .aw{background:var(--seal)}
.row.cut{margin-top:1.4vh;padding-top:1.9vh;border-top:1px dashed rgba(61,43,35,.28);position:relative}
.row.cut::before{content:"以下为上榜鼓励";position:absolute;top:-.95vh;left:50%;
  transform:translateX(-50%);background:var(--paper);padding:0 1vw;
  font:500 .95vw/1 system-ui;color:var(--ink3);letter-spacing:.14em}
.void{font:600 3.2vw/1.3 "Songti SC","Noto Serif CJK SC",serif;color:var(--ink2)}
#qrmini{position:fixed;right:1.4vw;bottom:1.4vw;display:none;text-align:center;font-size:.9vw;color:var(--ink2)}
#qrmini.on{display:block}
#qrmini img{width:11vh;height:11vh;background:#fff;padding:.4vh;box-shadow:0 0 0 1px var(--line)}
/* 主持人一键召回的大二维码。游戏开始后待机页就没了，迟到的人本来无处可扫 */
/* 鸣谢：颁奖结束后由主持人打到大屏。二维码要大到坐最后一桌也扫得到 */
#credits{position:fixed;inset:0;display:none;z-index:9;background:var(--paper);overflow:hidden}
#credits.on{display:grid;place-content:center;justify-items:center}
#credits .glow{position:absolute;inset:-20vmax;pointer-events:none}
#credits .glow i{position:absolute;display:block;border-radius:50%;filter:blur(70px);opacity:.55}
#credits .g1{width:50vmax;height:50vmax;left:6%;top:0;background:radial-gradient(circle,rgba(200,54,47,.2),transparent 68%)}
#credits .g2{width:44vmax;height:44vmax;right:4%;bottom:2%;background:radial-gradient(circle,rgba(201,162,39,.24),transparent 68%)}
#credits .inner{position:relative;display:grid;justify-items:center;gap:1.4vh}
#credits .seal{display:grid;place-content:center;width:7vh;height:7vh;background:var(--seal);color:#fff;
  border-radius:1.2vh;font:600 3.4vh/1 "Songti SC",serif}
#credits h2{font:600 6.4vh/1.2 "Songti SC","Noto Serif CJK SC",serif;margin:1.4vh 0 0;letter-spacing:.34em;text-indent:.34em;color:var(--ink)}
#credits .ln{width:11vh;height:.35vh;background:var(--gold);border-radius:1px;margin:.6vh 0 1.2vh}
#credits .lede{font-size:2.3vh;color:var(--ink2)}
#credits .two{display:grid;grid-template-columns:1fr 1fr;gap:6vh;margin-top:3.4vh}
#credits .one{display:grid;justify-items:center;gap:1vh}
#credits .role{font:500 1.7vh/1 system-ui;color:var(--gold2,#A88520);letter-spacing:.24em;
  border:1px solid rgba(201,162,39,.45);border-radius:99px;padding:.8vh 1.6vh}
#credits .who{font:600 3.6vh/1.2 "Songti SC","Noto Serif CJK SC",serif;color:var(--ink)}
#credits .box{position:relative;padding:1vh;background:#fff;border-radius:1.2vh;box-shadow:0 .4vh 2vh rgba(61,43,35,.12)}
#credits .box::after{content:"";position:absolute;inset:-.9vh;border:.28vh solid var(--seal);border-radius:1.8vh;opacity:.55}
#credits img{display:block;width:30vh;height:auto;border-radius:.6vh}
#credits .tail{margin-top:3vh;text-align:center;color:var(--ink2);font-size:2.1vh;line-height:2}
#credits .date{font:600 2.6vh/1.6 "Songti SC",serif;color:var(--ink);letter-spacing:.2em;margin-top:1vh}
@media (prefers-reduced-motion:no-preference){
  #credits.on .g1{animation:cdrift 24s ease-in-out infinite}
  #credits.on .g2{animation:cdrift2 30s ease-in-out infinite}
  #credits.on .seal{animation:cstamp .75s cubic-bezier(.2,1.5,.4,1) both}
  #credits.on h2{animation:cup .8s .2s cubic-bezier(.23,1,.32,1) both}
  #credits.on .lede{animation:cup .8s .5s cubic-bezier(.23,1,.32,1) both}
  #credits.on .one:nth-child(1){animation:cup .9s .72s cubic-bezier(.23,1,.32,1) both}
  #credits.on .one:nth-child(2){animation:cup .9s .9s cubic-bezier(.23,1,.32,1) both}
  #credits.on .tail{animation:cup .9s 1.15s cubic-bezier(.23,1,.32,1) both}
  #credits.on .box::after{animation:cbreathe 3.6s ease-in-out infinite}
}
@keyframes cdrift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(5vmax,4vmax) scale(1.12)}}
@keyframes cdrift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-5vmax,-4vmax) scale(1.14)}}
@keyframes cstamp{from{transform:scale(2.4) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes cup{from{transform:translateY(2.6vh);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes cbreathe{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.03);opacity:.9}}
#qrbig{position:fixed;inset:0;display:none;place-content:center;justify-items:center;gap:2vh;background:rgba(247,241,232,.97);z-index:8;font-size:2vw;color:var(--ink2)}
#qrbig.on{display:grid}
#qrbig img{width:46vh;height:46vh;background:#fff;padding:1.2vh;box-shadow:0 0 0 1px var(--line)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
<div id=chip><b id=bank>—</b><button id=fs>全屏</button></div>
<div id=conn></div>
<div id=stage></div>
<div id=qrmini><img src=/qr.png alt="" onerror=qrFail(this,1)><div>没进来的扫这里</div></div>
<div id=credits>
  <div class=glow><i class=g1></i><i class=g2></i></div>
  <div class=inner>
    <div class=seal>谢</div>
    <h2>鸣谢</h2>
    <div class=ln></div>
    <div class=lede>今天这个答题环节，是这两个人一起折腾出来的</div>
    <div class=two>
      <div class=one>
        <span class=role>活 动 策 划</span>
        <div class=who>草莓柚</div>
        <div class=box><img src=/wx-planner.jpg alt="活动策划微信" onerror="qrFail(this,1)"></div>
      </div>
      <div class=one>
        <span class=role>技 术 支 持</span>
        <div class=who>邱　鑫</div>
        <div class=box><img src=/wx-tech.jpg alt="技术支持微信" onerror="qrFail(this,1)"></div>
      </div>
    </div>
    <div class=tail>进不去、卡住了，或者只是想说句话，扫码都能找到我们<div class=date>2026 · 10 · 06</div></div>
  </div>
</div>
<div id=qrbig><img src=/qr.png alt="扫码进入" onerror=qrFail(this)><div>没进来的现在扫</div></div>
<script type=module>
import {C2S,S2C,STAGE,ROLE,RULES} from '/src/protocol.js';
const $=s=>document.querySelector(s);
const stage=$('#stage'),conn=$('#conn');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* 大屏不设口令：纯展示端、无控制能力，少一道口令就少一个当天会坏的地方 */

/* 二维码由 tools/genqr.js 离线生成。还没生成时降级为文字地址，不显示裂图。
   写成函数而不是内联属性 —— 内联属性里的引号嵌在 JS 字符串里，极易把字符串截断。 */
window.qrFail=(el,drop)=>{
  if(drop)return el.remove();
  const d=document.createElement('div');d.className='url';d.textContent=location.host;
  el.replaceWith(d);
};

$('#fs').onclick=()=>{
  // 全屏不只是好看：投影出去的应该是整块画面，不是一个带地址栏的浏览器窗口
  (document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()).catch(()=>{});
};

const S={stage:null,joined:0,answered:0,q:null,reveal:null,final:null};
let qrT=0;
function bigQr(){
  const el=$('#qrbig');el.classList.add('on');
  clearTimeout(qrT);qrT=setTimeout(()=>el.classList.remove('on'),25000);
}
let offset=0,deadline=0,raf=0;

const probes=[];
function sync(){for(let i=0;i<5;i++)setTimeout(()=>send({type:C2S.SYNC,t0:Date.now()}),i*120)}
function onPong(m){const t3=Date.now(),rtt=t3-m.t0;probes.push({rtt,off:m.t1-(m.t0+rtt/2)});probes.sort((a,b)=>a.rtt-b.rtt);offset=probes[0].off}

let ws=null,back=800,timer=0;
function send(m){if(ws?.readyState===1)ws.send(JSON.stringify(m))}
function connect(){
  clearTimeout(timer);
  ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host);
  ws.onopen=()=>{back=800;conn.textContent='';conn.className='';send({type:C2S.HELLO,role:ROLE.SCREEN});sync()};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}handle(m)};
  ws.onclose=()=>{conn.textContent='连接中断，正在重连…';conn.className='bad';timer=setTimeout(connect,back);back=Math.min(back*2,8000)};
  ws.onerror=()=>{try{ws.close()}catch{}};
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ws?.readyState!==1){back=800;connect()}});

function handle(m){
  switch(m.type){
    case S2C.PONG:return onPong(m);
    case S2C.REJECTED:stage.innerHTML='<div class="title serif">连接被拒绝</div><div class=lead>刷新试试，或联系技术支持</div>';return;
    case S2C.SNAPSHOT:
      S.stage=m.stage;S.joined=m.joined;S.answered=m.answered;$('#bank').textContent=m.bank||'—';
      $('#bank').className=/正式/.test(m.bank||'')?'live':'';
      S.q=m.question||null;S.reveal=m.reveal||null;S.final=m.final||null;
      if(S.q)deadline=S.q.deadlineAt;
      return render();
    case S2C.QUESTION:S.q=m;S.reveal=null;S.stage=STAGE.ASKING;deadline=m.deadlineAt;return render();
    case S2C.PROGRESS:S.joined=m.joined;S.answered=m.answered;return patchProgress();
    case S2C.REVEAL:S.reveal=m;S.stage=STAGE.REVEAL;return render();
    case S2C.FINAL:S.final=m.top10;S.stage=STAGE.FINAL;return render();
    case S2C.PAUSED:S.paused=true;return render();
    case S2C.RESUMED:S.paused=false;deadline=Date.now()+offset+(m.remainMs||0);return render();
    case S2C.NOTICE:return;
    case S2C.CREDITS:return $('#credits').classList.toggle('on',m.on!==false);
    case S2C.SHOW_QR:return bigQr();
  }
}

function tickLoop(){
  cancelAnimationFrame(raf);
  const el=$('#big');if(!el)return;
  const step=()=>{
    // 暂停时倒计时必须停住。大屏这个 17vh 的数字是全场的节奏，
    // 主持人按了暂停它却照走到 0，等于暂停没生效。
    if(S.paused){raf=requestAnimationFrame(step);return}
    const left=Math.max(0,deadline-offset-Date.now());
    const s=Math.ceil(left/1000);
    el.textContent=s;
    el.className=s<=5&&s>0?'warn':'';
    if(left>0)raf=requestAnimationFrame(step);
  };step();
}

function render(){
  const st=S.stage;
  $('#qrmini').classList.toggle('on',st!==STAGE.IDLE&&st!==STAGE.FINAL);
  if(st===STAGE.ASKING||st===STAGE.PAUSED)return paintAsk();
  if(st===STAGE.REVEAL)return paintReveal();
  if(st===STAGE.FINAL)return paintFinal();
  return paintIdle();
}

function paintIdle(){
  stage.classList.remove('final');
  cancelAnimationFrame(raf);
  const prizes=RULES.AWARDS.map(a=>'<div class=prize><b>'+a.name+'</b><span>'+a.count+' 位</span></div>').join('');
  stage.innerHTML='<div class="title serif">婚礼答题</div><div class=rule></div>'+
    '<img id=qr src=/qr.png alt="扫码进入" onerror=qrFail(this)>'+
    '<div class=url>扫码进入，不用打字</div>'+
    '<div class=prizes>'+prizes+'</div>'+
    '<div class=count>已入场 '+S.joined+' 位</div>';
}

function paintAsk(){
  stage.classList.remove('final');
  const q=S.q;if(!q)return paintIdle();
  stage.innerHTML='<div class=qno>第 '+(q.qIndex+1)+' 题 / '+q.total+'</div>'+
    '<div id=big class=num>'+'</div>'+
    '<div class="qtext serif">'+esc(q.text)+'</div>'+
    '<div class=opts>'+q.options.map((o,i)=>
      '<div class=opt><span class=k>'+'ABCD'[i]+'</span><span>'+esc(o)+'</span></div>').join('')+'</div>'+
    '<div class=answered id=ans></div>'+
    (S.paused?'<div class=lead style="color:var(--seal);font-weight:600">暂停中</div>':'');
  patchProgress();tickLoop();
}

function patchProgress(){
  const el=$('#ans');
  if(el)el.innerHTML='已作答 <b>'+S.answered+'</b> / <b>'+S.joined+'</b>';
  const c=document.querySelector('.count');
  if(c)c.textContent='已入场 '+S.joined+' 位';
}

function paintReveal(){
  stage.classList.remove('final');
  cancelAnimationFrame(raf);
  const r=S.reveal,q=S.q;
  if(r?.voided){
    stage.innerHTML='<div class=void>本题作废</div><div class=rule></div>'+
      '<div class=lead>所有人都不计分</div>'+board(r.top5,'当前前五名');
    return;
  }
    stage.innerHTML='<div class=qno>第 '+((r?.qIndex??0)+1)+' 题 · 正确答案</div>'+
    '<div class="qtext serif">'+esc(q?.text||'')+'</div>'+
    '<div class=opts>'+(q?.options||[]).map((o,i)=>
      '<div class="opt'+(i===r?.correctIndex?' right':'')+'"><span class=k>'+'ABCD'[i]+'</span>'+
      '<span>'+esc(o)+'</span><span class=cnt>'+((r?.distribution||[])[i]??0)+'</span></div>').join('')+'</div>'+
    board(r?.top5,'当前前五名');
}

function board(rows,title){
  if(!rows?.length)return '';
  return '<div class=qno style="margin-top:1vh">'+title+'</div><div class=board>'+
    rows.map(r=>'<div class="row t'+r.rank+'"><s>'+r.rank+'</s><u>'+esc(r.nickname)+'</u><em>'+r.total+'</em></div>').join('')+'</div>';
}

function paintFinal(){
  cancelAnimationFrame(raf);
  const list=S.final||[];
  // 最后一个有奖的名次之后画分界 —— 让全场看清奖发到哪儿为止
  let lastAward=0;
  list.forEach(r=>{if(r.award)lastAward=r.rank});
  stage.classList.add('final');
  stage.innerHTML='<div class="title serif">最终排名</div><div class=rule></div>'+
    '<div class=board>'+list.map(r=>
      '<div class="row t'+r.rank+(r.rank===lastAward+1?' cut':'')+'">'+
      '<s>'+r.rank+'</s><u>'+esc(r.nickname)+'</u><em>'+r.total+'</em>'+
      (r.award?'<span class=aw>'+esc(r.award)+'</span>':'')+
      '</div>').join('')+'</div>';
}

paintIdle();connect();
</script>
</html>
